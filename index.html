<!-- Add this section before the skills section -->
<section id="current-progress" class="section">
    <div class="container">
        <h2 class="section-title">See What He Is Doing Now</h2>
        <div class="upskill-cards">
            <!-- Cards will be dynamically populated from JavaScript -->
        </div>
    </div>
</section>

<!-- Add this modal template -->
<div id="upskill-modal" class="modal">
    <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 id="modal-title"></h2>
        
        <div class="progress-circle-container">
            <div class="progress-circle">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle" id="progress-path" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <text x="18" y="20.35" class="percentage" id="progress-text">0%</text>
                </svg>
            </div>
        </div>

        <div class="learning-log">
            <div class="date-search">
                <input type="date" id="date-filter" placeholder="Search by date">
            </div>
            <h3>Recent Learning</h3>
            <ul id="learning-list"></ul>
        </div>

        <form id="suggestion-form" class="suggestion-form">
            <textarea placeholder="Share your suggestions for improvement..." required></textarea>
            <button type="submit">Submit Suggestion</button>
        </form>
    </div>
</div>
